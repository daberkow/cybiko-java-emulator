name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          BASE_VERSION=$(cat emulator/VERSION | tr -d '[:space:]')
          FULL_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          TAG="v${FULL_VERSION}"
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew build distZip

      - name: Rename assets for release labeling
        env:
          EMU_VER: ${{ steps.version.outputs.version }}
        run: |
          cp "emulator/build/distributions/cybiko-emulator-${EMU_VER}.zip" \
             "emulator/build/distributions/Cybiko-Emulator-${EMU_VER}.zip"
          MGR_VER=$(cat manager/VERSION | tr -d '[:space:]')
          MGR_FULL="${MGR_VER}.${GITHUB_RUN_NUMBER}"
          cp "manager/build/distributions/cybiko-nvram-manager-${MGR_FULL}.zip" \
             "manager/build/distributions/Cybiko-NVRAM-Manager-${MGR_FULL}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Cybiko Emulator ${{ steps.version.outputs.tag }}"
          body: |
            ## Cybiko Emulator ${{ steps.version.outputs.tag }}

            ### Downloads
            - **Cybiko-Emulator** — the emulator (Swing UI, all machine variants)
            - **Cybiko-NVRAM-Manager** — desktop app for managing Cybiko flash images (JavaFX)

            Both require [Java 21+](https://adoptium.net/).

            ### Quick Start
            ```bash
            unzip Cybiko-Emulator-${{ steps.version.outputs.version }}.zip
            cd cybiko-emulator-${{ steps.version.outputs.version }}

            # Cybiko Xtreme
            bin/cybiko-emulator cyrom150.bin cyos_v1508.bin

            # Cybiko Classic V1
            bin/cybiko-emulator --machine v1 cyrom112.bin flash_v1246.bin

            # Load an app with persistent NVRAM
            bin/cybiko-emulator cyrom150.bin cyos_v1508.bin --nvram cybiko.nvram --app calc.app
            ```

            See the [README](https://github.com/daberkow/cybiko-java-emulator#quick-start) for full usage and ROM download links.
          files: |
            emulator/build/distributions/Cybiko-Emulator-*.zip
            manager/build/distributions/Cybiko-NVRAM-Manager-*.zip
          generate_release_notes: true
