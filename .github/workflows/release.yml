name: Release

on:
  push:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
          FULL_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          TAG="v${FULL_VERSION}"
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew build distZip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Cybiko Emulator ${{ steps.version.outputs.tag }}"
          body: |
            ## Cybiko Xtreme Java Emulator ${{ steps.version.outputs.tag }}

            Auto-release from `develop` branch.

            **Commit:** ${{ github.sha }}

            ### Usage
            ```bash
            unzip cybiko-java-${{ steps.version.outputs.version }}.zip
            cd cybiko-java-${{ steps.version.outputs.version }}
            bin/cybiko-java <boot_rom.bin> [flash_rom.bin] [options]
            ```

            ### Options
            | Flag | Description |
            |------|-------------|
            | `--headless` | Run without GUI |
            | `--mute` | Disable audio |
            | `--nvram <file>` | Persistent NVRAM |
            | `--app <file.app>` | Load app into NVRAM |

            Requires Java 21+.
          files: build/distributions/*.zip
          generate_release_notes: true
